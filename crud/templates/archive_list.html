<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THE VAULT | FILSYNC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #0f1418; font-family: 'Plus Jakarta Sans', sans-serif; color: white; padding-top: 50px; }
        .vault-card { background: #1a2026; border-radius: 40px; padding: 50px; border: 1px solid rgba(255,255,255,0.05); }
        .btn-recover { background: #2ecc71; color: white; border-radius: 50px; border: none; padding: 10px 25px; font-weight: 700; }
        .btn-purge { background: #ff5e57; color: white; border-radius: 50px; border: none; padding: 10px 25px; font-weight: 700; }
    </style>
</head>
<body>
<div class="container text-center">
    <div class="vault-card">
        <i class="bi bi-shield-lock-fill fs-1 text-pink mb-3"></i>
        <h1 class="fw-800 mb-4">THE VAULT<span style="color: #ff85a2;">.</span></h1>
        <form action="{% url 'vault_action' %}" method="POST">
            {% csrf_token %}
            <div class="d-flex justify-content-between mb-4">
                <div class="form-check"><input class="form-check-input" type="checkbox" id="selectAll"><label class="form-check-label small fw-bold">SELECT ALL</label></div>
                <div class="d-flex gap-2">
                    <button type="submit" name="action" value="recover" class="btn-recover">RECOVER</button>
                    <button type="submit" name="action" value="permanently_delete" class="btn-purge" onclick="return confirm('Purge data forever?')">PURGE</button>
                </div>
            </div>
            <table class="table table-dark text-start align-middle">
                <tbody>
                    {% for s in students %}
                    <tr>
                        <td><input class="form-check-input user-checkbox" type="checkbox" name="selected_users" value="{{ s.id }}"></td>
                        <td class="fw-800 py-3">{{ s.username }}</td>
                        <td class="small opacity-50">{{ s.email }}</td>
                        <td class="text-end"><span class="badge bg-light text-dark">{{ s.gender.gender|upper }}</span></td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="4" class="text-center py-5">Vault is empty.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </form>
        <a href="{% url 'user_list' %}" class="btn btn-outline-light rounded-pill px-4 mt-4">BACK TO HUB</a>
    </div>
</div>
<script>
    document.getElementById('selectAll').onclick = function() {
        let checkboxes = document.querySelectorAll('.user-checkbox');
        for (let checkbox of checkboxes) checkbox.checked = this.checked;
    }
</script>
</body>
</html>
