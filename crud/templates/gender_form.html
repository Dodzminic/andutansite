<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Category | FILSYNC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        :root { --pink: #ff85a2; --bg: #fdf8f9; }
        body { background-color: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .glass-card { background: white; border-radius: 35px; box-shadow: 0 20px 50px rgba(255, 133, 162, 0.1); width: 100%; max-width: 400px; padding: 40px; }
        .btn-pink { background: linear-gradient(45deg, #ff85a2, #ff6b8d); color: white; border-radius: 50px; font-weight: 700; border: none; padding: 15px; width: 100%; transition: 0.3s; }
    </style>
</head>
<body>
    <div class="glass-card text-center shadow-lg">
        <h2 class="fw-800 mb-4">Edit Category</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <input type="text" name="gender_name" value="{{ g.gender }}" class="form-control rounded-pill border-0 bg-light p-3 text-center fw-bold" required>
            </div>
            <button type="submit" class="btn-pink mb-3">Update Category</button>
            <a href="{% url 'user_list' %}" class="btn btn-light w-100 rounded-pill fw-bold" style="color: #636e72;">Cancel</a>
        </form>
    </div>
</body>
</html>
